<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Admin — BangoosBlog3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css?v=1788999573">
<script src="js/login.js?v=1788999573" defer></script>
</head>
<body>
<div class="center">
  <div class="login-orb" aria-hidden="true"></div>
  <div class="login-card">
    <div class="logo3d" aria-hidden="true"><span>B</span></div>
    <div class="kicker">Admin Console</div>
    <h1>Bangoos<span>Blog3D</span></h1>
    <p>Masuk untuk mengelola posting, komentar, dan pengaturan blog.</p>
    <form id="loginForm" autocomplete="off">
      <label class="sr" for="user">Username</label>
      <input id="user" placeholder="Username" required autofocus autocomplete="username">
      <label class="sr" for="pass">Password</label>
      <input id="pass" type="password" placeholder="Password" required autocomplete="current-password">
      <button class="btn" type="submit" id="loginBtn">Masuk</button>
    </form>
    <div class="err" id="err" role="alert" aria-live="polite"></div>
    <div class="login-meta">session-based auth · /auth/*</div>
  </div>
</div>
</body>
</html>
