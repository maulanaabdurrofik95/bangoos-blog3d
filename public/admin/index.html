<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Admin — BangoosBlog3D</title>
<link rel="stylesheet" href="css/admin.css">
<script src="js/login.js" defer></script>
</head>
<body>
<div class="center">
  <div class="login-card">
    <h1>Bangoos<span>Blog3D</span> Admin</h1>
    <p>Masuk untuk mengelola blog</p>
    <form id="loginForm" autocomplete="off">
      <input id="user" placeholder="Username" required autofocus>
      <input id="pass" type="password" placeholder="Password" required>
      <button class="btn" type="submit" id="loginBtn">Masuk</button>
    </form>
    <div class="err" id="err"></div>
  </div>
</div>
</body>
</html>
